name: CodeQL

# Code quality / security analysis for the shared Kotlin code. Uses CodeQL
# advanced setup so the extracted languages and query suite are versioned with
# the repo. Do not also enable CodeQL "default setup" in the repository
# settings: GitHub rejects a repository that has both.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.head_ref || github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze Kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # Kotlin 2.4 is newer than the build-instrumentation support in the
      # current CodeQL extractor. Build mode "none" analyzes source directly;
      # the regular CI workflow remains the authority for actual compilation.
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
