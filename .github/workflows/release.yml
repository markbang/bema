name: Release

# Tag pushes publish a GitHub Release; workflow_dispatch builds the same
# artifacts and uploads them as workflow artifacts only (dry run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # A tag-scoped cache entry would only ever be read by that tag.
          cache-read-only: true

      # GitHub Releases are the only distribution channel, so an unsigned APK is
      # not a degraded artifact — Android refuses to install it. Fail before
      # spending build minutes rather than publish a release only users notice is
      # broken. All four are checked because build.gradle.kts only wires up the
      # signing config when all four are non-blank.
      - name: Require the signing secrets
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secret(s):$missing"
            echo "::error::An unsigned APK cannot be installed on a device, so there is nothing to publish."
            exit 1
          fi

      - name: Decode the release keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Tests
        run: ./gradlew :app:sharedLogic:testAndroidHostTest

      - name: Build the release APKs
        run: ./gradlew :app:androidApp:assembleRelease

      - name: Verify release APK signatures
        run: |
          shopt -s nullglob
          apks=(app/androidApp/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No release APKs were produced."
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found in the Android SDK."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            if [[ "$apk" == *-unsigned.apk ]]; then
              echo "::error::$apk is unsigned."
              exit 1
            fi
            "$apksigner" verify --verbose --print-certs "$apk"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: app/androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            app/androidApp/build/outputs/apk/release/*.apk \
            --clobber

      # Publishes the APKs to the update host the app checks on launch. The catalog
      # the app reads is public; publishing needs the token. `app_id` must match
      # UpdateApi.APP_ID.
      - name: Publish to the update host
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YAOTA_PUBLISH_TOKEN: ${{ secrets.YAOTA_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${YAOTA_PUBLISH_TOKEN:-}" ]; then
            echo "::error::YAOTA_PUBLISH_TOKEN is not set — the APKs would never reach the in-app update prompt."
            exit 1
          fi
          host="https://mobile.talesofai.com"
          app_id="memos"
          version="$(cat version.txt)"
          release="$(gh release view "$GITHUB_REF_NAME" --json name,body,url)"
          title="$(jq -r '.name // ""' <<<"$release")"
          notes="$(jq -r '.body // ""' <<<"$release")"
          release_url="$(jq -r '.url' <<<"$release")"

          # The four real ABI splits; `universal` stays a GitHub Release asset only,
          # because the app selects the entry for its own ABI.
          for arch in arm64-v8a armeabi-v7a x86 x86_64; do
            apk="app/androidApp/build/outputs/apk/release/androidApp-${arch}-release.apk"
            sha256="$(sha256sum "$apk" | cut -d' ' -f1)"
            shape=(--form-string "version=$version" --form-string "arch=$arch" --form-string "sha256=$sha256")
            # Omitted fields are stored as null, which is what the app expects for a
            # release published without notes.
            if [ -n "$title" ]; then shape+=(--form-string "title=$title"); fi
            if [ -n "$notes" ]; then shape+=(--form-string "notes=$notes"); fi
            if [ -n "$release_url" ]; then shape+=(--form-string "release_url=$release_url"); fi
            curl -fsS -X POST "$host/ota-publish/apks?app_id=$app_id" \
              -H "x-ota-api-key: $YAOTA_PUBLISH_TOKEN" \
              "${shape[@]}" \
              -F "file=@$apk;type=application/vnd.android.package-archive" > /dev/null
            echo "published $arch for $version ($(stat -c%s "$apk") bytes)"
          done

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Restore-only: a cache entry written by a tag push is scoped to that tag.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate Xcode project
        working-directory: app/iosApp
        run: xcodegen generate

      # The archive is unsigned (no signing identity in CI). Sign and export it
      # locally, or add the certificate + provisioning profile to the repo
      # secrets to make this distributable.
      - name: Archive
        working-directory: app/iosApp
        run: |
          set -o pipefail
          VERSION=$(cat ../../version.txt)
          xcodebuild archive \
            -project Bema.xcodeproj \
            -scheme Bema \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Bema.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Bema.xcarchive" "$RUNNER_TEMP/Bema.xcarchive.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ios-archive
          path: ${{ runner.temp }}/Bema.xcarchive.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Bema.xcarchive.zip" --clobber
