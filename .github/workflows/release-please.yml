name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Reads Conventional Commits (feat:, fix:, chore:, ...) and keeps a release
      # PR up to date. Merging that PR bumps version.txt + CHANGELOG.md, creates
      # the vX.Y.Z tag and the GitHub Release — which in turn triggers
      # .github/workflows/release.yml to build and attach the artifacts.
      #
      # Uses the default GITHUB_TOKEN. Pull requests opened with GITHUB_TOKEN do
      # not trigger other workflows, so the release PR shows no CI checks; set a
      # RELEASE_PLEASE_TOKEN secret (PAT) to have them run.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
