name: Bema
options:
  bundleIdPrefix: dev.bema
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Defaults for local builds; the release workflow overrides them from
    # version.txt (see .github/workflows/release.yml).
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Bema:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Bema
        CFBundleIcons: {}
        CFBundleIcons~ipad: {}
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bema.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Gradle build phase below shells out, so script sandboxing must be off
        # (Xcode enables it by default for new projects).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Where the Kotlin framework is produced by
        # :app:sharedLogic:embedAndSignAppleFrameworkForXcode.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../sharedLogic/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework SharedLogic"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    preBuildScripts:
      # Official "direct integration" setup:
      # https://kotlinlang.org/docs/multiplatform/multiplatform-direct-integration.html
      - name: Compile Kotlin
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          # Xcode started from the Dock/Finder does not inherit the shell
          # environment, so JAVA_HOME may be missing.
          if [ -z "${JAVA_HOME:-}" ] && [ -x /usr/libexec/java_home ]; then
            export JAVA_HOME=$(/usr/libexec/java_home -v 17 2>/dev/null || /usr/libexec/java_home)
          fi
          cd "$SRCROOT/../.."
          ./gradlew :app:sharedLogic:embedAndSignAppleFrameworkForXcode

# Generate a shared scheme so `xcodebuild -scheme Bema` works on CI machines
# that never opened the project in Xcode.
schemes:
  Bema:
    build:
      targets:
        Bema: all
    run:
      config: Debug
    archive:
      config: Release
