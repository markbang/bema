# --- Gradle ---------------------------------------------------------------
# Deliberately modest: the smallest GitHub-hosted runners this repository
# targets are 3 vCPU / 7 GB (macos-26) and 2 vCPU / 8 GB (ubuntu-24.04 for
# private repos). The Gradle daemon, the Kotlin daemon, Xcode and the
# Kotlin/Native linker all have to fit in there. Raise these as the project
# grows, or override GRADLE_OPTS per workflow.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- Kotlin ---------------------------------------------------------------
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1536m
# iOS simulator tests cannot run on Linux/Windows CI agents; don't warn about it.
kotlin.native.ignoreDisabledTargets=true

# --- Android --------------------------------------------------------------
android.useAndroidX=true
